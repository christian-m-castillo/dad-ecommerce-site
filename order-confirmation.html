<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Confirmation</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Order Confirmation</h1>
  </header>

  <main>
    <section id="confirmation-container">
      <h2>Thank you for your order, <span id="customer-name"></span>!</h2>
      <p>Your order has been placed successfully. Here are the details:</p>

      <h3>Shipping Details</h3>
      <p><strong>Address:</strong> <span id="customer-address"></span></p>
      <p><strong>City:</strong> <span id="customer-city"></span></p>
      <p><strong>ZIP Code:</strong> <span id="customer-zip"></span></p>

      <h3>Order Summary</h3>
      <ul id="order-summary"></ul>

      <p>We will send you an email with tracking details once your order has been shipped.</p>
      <a href="index.html">Return to Home</a>
    </section>
  </main>

  <script src="order-confirmation.js"></script>
</body>
</html>
